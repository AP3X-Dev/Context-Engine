---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: context-engine
  labels:
    app: context-engine
    component: redis
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    app: context-engine
    component: redis

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: context-engine
  labels:
    app: context-engine
    component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: context-engine
      component: redis
  template:
    metadata:
      labels:
        app: context-engine
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 10
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app: context-engine
        component: redis
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ceph-block  # Ceph RWO block storage
      resources:
        requests:
          storage: 5Gi
