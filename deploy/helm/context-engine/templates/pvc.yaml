      storage: {{ .Values.persistence.codeMetadata.size }}
  {{- if .Values.persistence.codeMetadata.existingVolumeName }}
  volumeName: {{ .Values.persistence.codeMetadata.existingVolumeName }}
  {{- end }}
{{- end }}
---
{{- if .Values.persistence.codeModels.enabled }}
