{{- if .Values.podDisruptionBudget.enabled }}
{{- if .Values.qdrant.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qdrant-pdb
  namespace: {{ include "context-engine.namespace" . }}
  labels:
    {{- include "context-engine.labels" . | nindent 4 }}
    component: qdrant
spec:
  {{- if .Values.podDisruptionBudget.qdrant.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.qdrant.minAvailable }}
  {{- else if .Values.podDisruptionBudget.qdrant.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.qdrant.maxUnavailable }}
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "context-engine.selectorLabels" . | nindent 6 }}
      component: qdrant
{{- end }}
