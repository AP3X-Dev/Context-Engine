<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="cgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
    <!-- Radial glow behind mark -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cgrid)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#6366f1"/>

  <!-- Glow circle -->
  <circle cx="600" cy="220" r="200" fill="url(#glow)"/>

  <!-- Central hexagonal mark -->
  <g transform="translate(600, 200)">
    <path d="M0 -40L34.64 -20v40L0 40-34.64 20V-20L0-40z" stroke="#6366f1" stroke-width="2" fill="none"/>
    <path d="M-20 0c0 0 9-15 20-15s20 15 20 15-9 15-20 15-20-15-20-15z" stroke="#6366f1" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="6" fill="#6366f1"/>
    <circle cx="0" cy="0" r="2.5" fill="#0a0a0a"/>
  </g>

  <!-- ONI Cortex title -->
  <text x="600" y="310" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="8">
    <tspan fill="#6366f1">ONI</tspan><tspan fill="#ffffff"> Cortex</tspan>
  </text>

  <!-- Divider -->
  <rect x="500" y="340" width="200" height="2" fill="#6366f1" rx="1"/>

  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="'Inter', 'SF Pro', -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#a1a1aa" font-weight="400">MCP Retrieval for AI Agents</text>

  <!-- Domain -->
  <text x="600" y="440" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="20" fill="#6366f1" font-weight="500">oni.bot/cortex</text>

  <!-- Three feature pills -->
  <g transform="translate(600, 500)">
    <g transform="translate(-280, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" fill="#a1a1aa">Semantic Search</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" fill="#a1a1aa">Multi-Tenant</text>
    </g>
    <g transform="translate(280, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" fill="#a1a1aa">MCP Native</text>
    </g>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="627" width="1200" height="3" fill="#6366f1"/>
</svg>
