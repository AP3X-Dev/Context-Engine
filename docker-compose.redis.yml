# Redis cache/state backend (optional)
# Usage: docker compose -f docker-compose.yml -f docker-compose.redis.yml up -d
#
# Enable via: CODEBASE_STATE_BACKEND=redis (or CODEBASE_STATE_REDIS_ENABLED=1) in your .env file
#
# Redis: redis://localhost:6379/0

services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dev-remote-network

volumes:
  redis_data:
    driver: local
