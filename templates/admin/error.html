{% extends "admin/base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 80px auto; text-align: center;">
  <div style="width: 64px; height: 64px; margin: 0 auto 24px; background: var(--danger-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
  </div>

  <h1 style="font-size: 24px; font-weight: 600; margin: 0 0 8px 0; color: var(--text-primary);">{{ title }}</h1>
  <p style="color: var(--text-muted); margin: 0 0 32px 0; font-size: 15px;">{{ message }}</p>

  <a href="{{ back_href }}" class="btn btn-secondary" style="text-decoration: none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12,19 5,12 12,5"/>
    </svg>
    Go Back
  </a>
</div>
{% endblock %}
