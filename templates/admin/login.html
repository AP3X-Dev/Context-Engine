<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #09090b;
        --bg-card: rgba(18, 18, 24, 0.8);
        --bg-input: rgba(0, 0, 0, 0.3);
        --text-primary: #fafafa;
        --text-secondary: #a1a1aa;
        --text-muted: #52525b;
        --border: rgba(255, 255, 255, 0.06);
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --accent-glow: rgba(99, 102, 241, 0.35);
        --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        --danger: #ef4444;
        --danger-bg: rgba(239, 68, 68, 0.12);
        --danger-border: rgba(239, 68, 68, 0.25);
        --radius: 10px;
        --radius-lg: 16px;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
          radial-gradient(ellipse 80% 60% at 50% -30%, rgba(99, 102, 241, 0.2), transparent 50%),
          radial-gradient(ellipse 50% 50% at 80% 100%, rgba(139, 92, 246, 0.12), transparent 50%);
        pointer-events: none;
        animation: gradientPulse 15s ease-in-out infinite alternate;
      }

      @keyframes gradientPulse {
        0% { opacity: 1; }
        100% { opacity: 0.6; }
      }

      .login-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        padding: 24px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 36px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }

      .logo-icon {
        width: 52px;
        height: 52px;
        background: var(--accent-gradient);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
      }

      .logo-icon svg { width: 28px; height: 28px; fill: white; }

      .logo-text {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }

      .login-title {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }

      .login-subtitle {
        font-size: 15px;
        color: var(--text-muted);
        margin: 0;
      }

      .login-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 36px;
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      }

      .error-message {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 24px;
        color: var(--danger);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 16px -4px var(--danger);
      }

      .error-message svg { flex-shrink: 0; width: 18px; height: 18px; }

      .form-group { margin-bottom: 22px; }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }

      .form-input {
        width: 100%;
        padding: 14px 16px;
        font-size: 14px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-primary);
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-glow), 0 0 24px -4px var(--accent);
      }

      .form-input::placeholder { color: var(--text-muted); }

      .btn-primary {
        width: 100%;
        padding: 14px 20px;
        font-size: 14px;
        font-weight: 600;
        background: var(--accent-gradient);
        color: white;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
        position: relative;
        overflow: hidden;
      }

      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.5s ease;
      }

      .btn-primary:hover::before { left: 100%; }

      .btn-primary:hover {
        box-shadow: 0 4px 24px rgba(99, 102, 241, 0.5), 0 0 40px -10px var(--accent);
        transform: translateY(-1px);
      }

      .btn-primary:active { transform: translateY(0) scale(0.98); }

      .footer {
        text-align: center;
        margin-top: 28px;
        color: var(--text-muted);
        font-size: 12px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="logo">
          <span class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </span>
          <span class="logo-text">Context-Engine</span>
        </div>
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">Sign in to manage your collections</p>
      </div>

      <div class="login-card">
        {% if error %}
        <div class="error-message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/admin/login">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" autocomplete="username" required autofocus />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
      </div>

      <div class="footer">CTXCE Admin UI</div>
    </div>
  </body>
</html>
