<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #111118;
        --bg-card: #16161d;
        --bg-input: #0d0d12;
        --text-primary: #e4e4e7;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --border: rgba(255, 255, 255, 0.08);
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --accent-glow: rgba(99, 102, 241, 0.25);
        --success: #22c55e;
        --success-bg: rgba(34, 197, 94, 0.1);
        --danger: #ef4444;
        --danger-bg: rgba(239, 68, 68, 0.1);
        --radius: 8px;
        --radius-lg: 12px;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
        padding: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        width: 100%;
        max-width: 440px;
        padding: 24px;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-icon svg { width: 28px; height: 28px; fill: white; }
      .logo-text { font-size: 24px; font-weight: 600; }

      .title { font-size: 20px; font-weight: 600; margin: 0 0 8px 0; }
      .subtitle { font-size: 14px; color: var(--text-muted); margin: 0; }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 32px;
      }

      .info-banner {
        background: var(--success-bg);
        border: 1px solid rgba(34, 197, 94, 0.2);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 24px;
        color: var(--success);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .info-banner svg { flex-shrink: 0; width: 18px; height: 18px; }

      .error-message {
        background: var(--danger-bg);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 24px;
        color: var(--danger);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .error-message svg { flex-shrink: 0; width: 18px; height: 18px; }

      .form-group { margin-bottom: 20px; }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .form-input {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-primary);
        transition: all 150ms ease;
      }

      .form-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }

      .form-input::placeholder { color: var(--text-muted); }

      .btn-primary {
        width: 100%;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 500;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 150ms ease;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
        box-shadow: 0 0 20px 2px var(--accent-glow);
      }

      .btn-primary:active { transform: scale(0.98); }

      .footer {
        text-align: center;
        margin-top: 24px;
        color: var(--text-muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">
          <span class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </span>
          <span class="logo-text">Context-Engine</span>
        </div>
        <h1 class="title">Bootstrap Admin</h1>
        <p class="subtitle">Create your first admin account</p>
      </div>

      <div class="card">
        <div class="info-banner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22,4 12,14.01 9,11.01"/>
          </svg>
          No users exist yet. Create the first admin account.
        </div>

        {% if error %}
        <div class="error-message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/admin/bootstrap">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" autocomplete="username" required autofocus />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Choose a strong password" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn-primary">Create Admin Account</button>
        </form>
      </div>

      <div class="footer">CTXCE Admin UI</div>
    </div>
  </body>
</html>
